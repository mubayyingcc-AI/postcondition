[project]
name = "postcondition"
version = "0.1.0"
description = "Verify what actually happened after an AI agent action, not just what it claimed."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
]

[project.scripts]
pcheck = "pcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pcheck"]
